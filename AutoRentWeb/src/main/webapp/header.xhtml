<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:fn="http://xmlns.jcp.org/jsp/jstl/functions">

	<!-- Backdrop para fechar o menu no mobile -->
	<div class="sidebar-backdrop" onclick="closeSidebar()"></div>

	<!-- Inclusão do Menu Lateral (Sidebar) -->
	<ui:include src="menu.xhtml" />

	<!-- Barra Superior Fixa (Topbar) -->
	<header class="app-topbar">
		<div class="topbar-left">
			<button type="button" class="sidebar-toggle" onclick="toggleSidebar()" aria-label="Alternar Menu">
				<i class="bi bi-list"></i>
			</button>
			<div class="topbar-breadcrumb">
				<i class="bi bi-shield-check text-primary"></i>
				<span>AutoRent • <strong>Plataforma Corporativa</strong></span>
			</div>
		</div>

		<div class="topbar-right">
			<div class="system-status">
				<span class="status-dot"></span>
				<span class="status-text">Sistema Conectado</span>
			</div>

			<div class="topbar-user">
				<span class="topbar-avatar">
				    <h:outputText value="#{userMB.loggedUser != null and not empty userMB.loggedUser.name ? fn:toUpperCase(fn:substring(userMB.loggedUser.name, 0, 1)) : 'U'}" />
				</span>
				<span>
					<h:outputText value="#{userMB.loggedUser != null ? userMB.loggedUser.name : 'Gestor'}" />
				</span>
			</div>
		</div>
	</header>

	<!-- Script de suporte à interface -->
	<script src="#{request.contextPath}/resources/js/app.js"></script>
</ui:composition>
