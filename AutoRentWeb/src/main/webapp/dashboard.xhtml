<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
      
	<h:head>
		<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
		<title>AutoRent - Home</title>
	</h:head>
	
	<h:body>
		<ui:include src="header.xhtml" />
		
		<h:panelGroup layout="block">
			<h1>Dashboard - Visão Geral da Frota</h1>
			
			<h:form>
				<h:commandButton value="Atualizar Dados" action="#{fleetMB.refresh}" />
			</h:form>

			<!-- Cards de Indicadores Globais -->
			<div class="card-container">
				<div class="card">
					<h3>Total de Veículos</h3>
					<span>#{fleetMB.totalVehicles}</span>
				</div>
				<div class="card">
					<h3>Disponíveis</h3>
					<span>#{fleetMB.totalAvailable}</span>
				</div>
				<div class="card">
					<h3>Alugados</h3>
					<span>#{fleetMB.totalRented}</span>
				</div>
				<div class="card">
					<h3>Reservados</h3>
					<span>#{fleetMB.totalReserved}</span>
				</div>
				<div class="card">
					<h3>Em Manutenção</h3>
					<span>#{fleetMB.totalMaintenance}</span>
				</div>
			</div>
		</h:panelGroup>
	</h:body>
</html>
