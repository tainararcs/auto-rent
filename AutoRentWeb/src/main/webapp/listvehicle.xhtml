<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
	
	<h:head>
		<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
	    <title>AutoRent - Veículos</title>
	</h:head>
	
	<h:body>
		<ui:include src="header.xhtml" />
		
		<h:panelGroup layout="block">
			<h1>Frota de Veículos Disponíveis</h1>
			
		    <!-- Seção de Filtros -->
		    <div class="filter-section">
		        <h:form>
		            <h:panelGrid columns="4" cellpadding="5">
		                <h:outputLabel for="cat" value="Categoria:" />
		                <h:selectOneMenu id="cat" value="#{vehicleMB.selectedCategory}">
		                    <f:selectItem itemLabel="-- Todas --" itemValue="" />
		                    <f:selectItems value="#{vehicleMB.categories}" 
		                                   var="c" itemLabel="#{c.category}" itemValue="#{c}" />
		                </h:selectOneMenu>
		
		                <h:outputLabel for="status" value="Status:" />
		                <h:selectOneMenu id="status" value="#{vehicleMB.selectedStatus}">
		                    <f:selectItem itemLabel="-- Todos --" itemValue="" />
		                    <f:selectItems value="#{vehicleMB.status}" 
			                   var="s" itemLabel="#{s.status}" itemValue="#{s}" />
		                </h:selectOneMenu>
		            </h:panelGrid>
		            
		            <h:commandButton value="Filtrar" action="#{vehicleMB.filter}" />
		            <h:commandButton value="Limpar" action="#{vehicleMB.cleanFilters}" />
		        </h:form>
		    </div>
		
		    <!-- Tabela de Listagem -->
		    <h:form>
		        <h:dataTable value="#{vehicleMB.vehiclesList}" var="v" border="1">
		            <h:column>
		                <f:facet name="header">ID</f:facet> #{v.id}
		            </h:column>
		            <h:column>
		                <f:facet name="header">Placa</f:facet> #{v.plate}
		            </h:column>
		            <h:column>
		                <f:facet name="header">Marca</f:facet> #{v.brand}
		            </h:column>
		            <h:column>
		                <f:facet name="header">Modelo</f:facet> #{v.model}
		            </h:column>
		            <h:column>
		                <f:facet name="header">Ano</f:facet> #{v.year}
		            </h:column>
		            <h:column>
		                <f:facet name="header">Categoria</f:facet> #{v.category.category}
		            </h:column>
		            <h:column>
		                <f:facet name="header">Diária (R$)</f:facet> #{v.dailyRate}
		            </h:column>
		            <h:column>
		                <f:facet name="header">Status</f:facet> #{v.status.status}
		            </h:column>
		            <h:column>
		                <f:facet name="header">Agência</f:facet> #{v.agency.name}
		            </h:column>
		        </h:dataTable>
		    </h:form>
		</h:panelGroup>
	</h:body>
</html>
