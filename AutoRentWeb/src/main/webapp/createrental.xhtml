<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
      
	<h:head>
		<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
		<title>AutoRent - Locações</title>
	</h:head>
	
	<h:body>
		<ui:include src="header.xhtml" />
		
		<h:panelGroup layout="block">
			<h1>Realizar Nova Locação</h1>
			
			<!-- Exibe mensagens de erro ou validação do formulário -->
			<h:messages globalOnly="false" />
			
			<h:form>
				<h:panelGrid columns="2" cellpadding="8">
					
					<!-- Agência de Retirada -->
					<h:outputLabel for="pickupAgency" value="Agência de Retirada:" />
					<h:selectOneMenu id="pickupAgency" value="#{rentalMB.pickupAgencyId}" required="true" requiredMessage="Selecione a agência de retirada.">
						<f:selectItem itemLabel="-- Selecione a Agência --" itemValue="" />
						<f:selectItems value="#{rentalMB.agenciesList}" var="a" itemLabel="#{a.name} (#{a.city})" itemValue="#{a.id}" />
					</h:selectOneMenu>
					
					<!-- Agência de Devolução -->
					<h:outputLabel for="returnAgency" value="Agência de Devolução:" />
					<h:selectOneMenu id="returnAgency" value="#{rentalMB.returnAgencyId}" required="true" requiredMessage="Selecione a agência de devolução.">
						<f:selectItem itemLabel="-- Selecione a Agência --" itemValue="" />
						<f:selectItems value="#{rentalMB.agenciesList}" var="a" itemLabel="#{a.name} (#{a.city})" itemValue="#{a.id}" />
					</h:selectOneMenu>
					
					<!-- Veículo Disponível -->
					<h:outputLabel for="vehicle" value="Veículo Disponível:" />
					<h:selectOneMenu id="vehicle" value="#{rentalMB.vehicleId}" required="true" requiredMessage="Selecione um veículo.">
						<f:selectItem itemLabel="-- Selecione o Veículo --" itemValue="" />
						<f:selectItems value="#{rentalMB.availableVehiclesList}" var="v" 
						               itemLabel="#{v.brand} #{v.model} - #{v.plate} (R$ #{v.dailyRate}/dia)" itemValue="#{v.id}" />
					</h:selectOneMenu>
					
					<!-- Acessórios Opcionais -->
					<h:outputLabel value="Acessórios Opcionais:" />
					<h:selectManyCheckbox value="#{rentalMB.selectedAccessoryIds}" layout="pageDirection">
						<f:selectItems value="#{rentalMB.accessoriesList}" var="acc" 
						               itemLabel="#{acc.description} - R$ #{acc.dailyRate}" itemValue="#{acc.id}" />
					</h:selectManyCheckbox>
					
				</h:panelGrid>
				
				<br />
				<h:commandButton value="Confirmar Reserva" action="#{rentalMB.createRental}" />
			</h:form>
		</h:panelGroup>
	</h:body>
</html>
