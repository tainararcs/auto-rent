<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
      
	<h:head>
		<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>AutoRent - Realizar Locação</title>
		<link rel="stylesheet" href="#{request.contextPath}/resources/css/app.css" />
		<h:outputStylesheet library="css" name="app.css" />
		<link rel="icon" href="#{request.contextPath}/resources/icon/icon-car.png" type="image/png" />
	</h:head>
	
	<h:body styleClass="app-body">
		<!-- Inclusão do Cabeçalho e Barra de Navegação -->
		<ui:include src="header.xhtml" />
		
		<!-- Conteúdo Principal -->
		<main class="main-content">
			<div class="content-wrapper">
				
				<!-- Cabeçalho da Página -->
				<div class="page-header">
					<div class="page-title-group">
						<h1>Nova Locação de Veículo</h1>
						<p>Selecione as agências de operação, escolha o automóvel desejado e adicione opcionais</p>
					</div>
				</div>

				<!-- Exibe mensagens de erro ou validação do formulário -->
				<h:messages globalOnly="false" id="formMessages" />

				<!-- Card do Formulário de Locação -->
				<div class="form-card">
					<div class="form-card-header">
						<div class="form-card-header-icon">
							<i class="bi bi-car-front-fill"></i>
						</div>
						<div class="form-card-header-text">
							<h2>Parâmetros da Reserva</h2>
							<p>Informe a agência de origem, agência de destino e personalize o contrato</p>
						</div>
					</div>

					<div class="form-card-body">
						<h:form id="rentalForm">
							<div class="rental-form-grid">
								
								<!-- Linha 1: Seletores de Agência de Retirada e Devolução (Duas Colunas Perfeitamente Alinhadas) -->
								<div class="form-row two-columns">
									<div class="form-group">
										<h:outputLabel for="pickupAgency" value="Agência de Retirada *" styleClass="form-label" />
										<h:selectOneMenu id="pickupAgency" value="#{rentalMB.pickupAgencyId}" required="true" requiredMessage="Selecione a agência de retirada" styleClass="form-control">
											<f:selectItem itemLabel="Selecione a Agência de Retirada" itemValue="" />
											<f:selectItems value="#{rentalMB.agenciesList}" var="a" itemLabel="#{a.name} - #{a.city}" itemValue="#{a.id}" />
										</h:selectOneMenu>
									</div>
									
									<div class="form-group">
										<h:outputLabel for="returnAgency" value="Agência de Devolução *" styleClass="form-label" />
										<h:selectOneMenu id="returnAgency" value="#{rentalMB.returnAgencyId}" required="true" requiredMessage="Selecione a agência de devolução" styleClass="form-control">
											<f:selectItem itemLabel="Selecione a Agência de Devolução" itemValue="" />
											<f:selectItems value="#{rentalMB.agenciesList}" var="a" itemLabel="#{a.name} - #{a.city}" itemValue="#{a.id}" />
										</h:selectOneMenu>
									</div>
								</div>
								
								<!-- Linha 2: Veículo Disponível na Frota -->
								<div class="form-group">
									<h:outputLabel for="vehicle" value="Veículo da Frota *" styleClass="form-label" />
									<h:selectOneMenu id="vehicle" value="#{rentalMB.vehicleId}" required="true" requiredMessage="Selecione um veículo" styleClass="form-control">
										<f:selectItem itemLabel="Selecione o Veículo Disponível" itemValue="" />
										<f:selectItems value="#{rentalMB.availableVehiclesList}" var="v" itemLabel="#{v.brand} #{v.model} • Placa: #{v.plate} • R$ #{v.dailyRate}/dia" itemValue="#{v.id}" />
									</h:selectOneMenu>
								</div>
								
								<!-- Linha 3: Acessórios Opcionais -->
								<div class="form-group">
									<label class="form-label">Acessórios Opcionais</label>
									<div class="accessories-container">
										<h:selectManyCheckbox id="selectedAccessoryIds" value="#{rentalMB.selectedAccessoryIds}" layout="pageDirection" styleClass="accessories-checkbox-list">
											<f:selectItems value="#{rentalMB.accessoriesList}" var="acc" itemLabel="#{acc.description} (+ R$ #{acc.dailyRate}/dia)" itemValue="#{acc.id}" />
										</h:selectManyCheckbox>
									</div>
								</div>
							</div>
							
							<div class="form-actions">
								<h:link outcome="dashboard" value="Cancelar" styleClass="btn btn-secondary" />
								<h:commandButton id="btnConfirmRental" value="Confirmar Reserva" action="#{rentalMB.createRental}" styleClass="btn btn-primary btn-lg" />
							</div>
						</h:form>
					</div>
				</div>
			</div>
		</main>
	</h:body>
</html>
