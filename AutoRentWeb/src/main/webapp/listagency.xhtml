<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
      
	<h:head>
		<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
		<title>AutoRent - Agências</title>
	</h:head>
	
	<h:body>
		<ui:include src="header.xhtml" />
		
		<h:panelGroup layout="block">
			<h1>Agências</h1>
			
			<div>
				<h:dataTable value="#{agencyMB.agenciesList}" var="a" border="1">
		            <h:column>
		                <f:facet name="header">ID</f:facet> #{a.id}
		            </h:column>
		            <h:column>
		                <f:facet name="header">Nome</f:facet> #{a.name}
		            </h:column>
		            <h:column>
		                <f:facet name="header">Endereço</f:facet> #{a.address}
		            </h:column>
		            <h:column>
		                <f:facet name="header">Cidade</f:facet> #{a.city}
		            </h:column>
		            <h:column>
		                <f:facet name="header">Telefone</f:facet> #{a.phoneNumber}
		            </h:column>
		        </h:dataTable>
			</div>
		</h:panelGroup>
	</h:body>
</html>
