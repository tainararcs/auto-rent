<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
      
	<h:head>
		<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>AutoRent - Rede de Agências</title>
		<link rel="stylesheet" href="#{request.contextPath}/resources/css/app.css" />
		<h:outputStylesheet library="css" name="app.css" />
	</h:head>
	
	<h:body styleClass="app-body">
		<!-- Inclusão do Cabeçalho e Barra de Navegação -->
		<ui:include src="header.xhtml" />
		
		<!-- Conteúdo Principal -->
		<main class="main-content">
			<div class="content-wrapper">
				
				<!-- Cabeçalho da Página -->
				<div class="page-header">
					<div class="page-title-group">
						<h1>Rede Integrada de Agências</h1>
						<p>Consulte todos os pontos físicos de atendimento, retirada de chaves e devolução de automóveis.</p>
					</div>
				</div>

				<!-- Tabela de Listagem de Agências -->
				<div class="table-responsive">
					<h:dataTable value="#{agencyMB.agenciesList}" var="a" styleClass="data-table">
			            <h:column>
			                <f:facet name="header">ID</f:facet> 
			                <strong>##{a.id}</strong>
			            </h:column>
			            <h:column>
			                <f:facet name="header">Agência</f:facet> 
			                <strong class="cell-title">
			                	<i class="bi bi-buildings-fill text-primary cell-icon-lg"></i>#{a.name}
			                </strong>
			            </h:column>
			            <h:column>
			                <f:facet name="header">Endereço Completo</f:facet> 
			                <i class="bi bi-geo-alt text-muted cell-icon"></i>#{a.address}
			            </h:column>
			            <h:column>
			                <f:facet name="header">Cidade / Polo</f:facet> 
			                <strong>#{a.city}</strong>
			            </h:column>
			            <h:column>
			                <f:facet name="header">Contato Telefônico</f:facet> 
			                <i class="bi bi-telephone text-muted cell-icon"></i>#{a.phoneNumber}
			            </h:column>
			        </h:dataTable>
				</div>

			</div>
		</main>
	</h:body>
</html>
