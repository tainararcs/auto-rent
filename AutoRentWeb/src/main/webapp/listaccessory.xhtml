<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
      
	<h:head>
		<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>AutoRent - Acessórios Disponíveis</title>
		<link rel="stylesheet" href="#{request.contextPath}/resources/css/app.css" />
		<h:outputStylesheet library="css" name="app.css" />
	</h:head>
	
	<h:body styleClass="app-body">
		<!-- Inclusão do Cabeçalho e Barra de Navegação -->
		<ui:include src="header.xhtml" />
		
		<!-- Conteúdo Principal -->
		<main class="main-content">
			<div class="content-wrapper">
				
				<!-- Cabeçalho da Página -->
				<div class="page-header">
					<div class="page-title-group">
						<h1>Catálogo de Acessórios e Opcionais</h1>
						<p>Equipamentos adicionais disponíveis para agregar segurança e conveniência às locações.</p>
					</div>
				</div>

				<!-- Tabela de Listagem de Acessórios -->
				<div class="table-responsive">
					<h:dataTable value="#{accessoryMB.accessoriesList}" var="a" styleClass="data-table">
			            <h:column>
			                <f:facet name="header">ID</f:facet> 
			                <strong>##{a.id}</strong>
			            </h:column>
			            <h:column>
			                <f:facet name="header">Item Opcional / Descrição</f:facet> 
			                <strong class="cell-title">
			                	<i class="bi bi-gear-wide-connected text-primary cell-icon-lg"></i>#{a.description}
			                </strong>
			            </h:column>
			            <h:column>
			                <f:facet name="header">Tarifa Diária</f:facet> 
			                <strong class="price-highlight">R$ #{a.dailyRate}</strong>
			                <span class="unit-suffix">/dia</span>
			            </h:column>
			        </h:dataTable>
				</div>

			</div>
		</main>
	</h:body>
</html>
