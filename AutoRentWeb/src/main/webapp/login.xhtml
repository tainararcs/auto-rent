<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
	<head>
		<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
		<title>Auto-Rent Login</title>
	</head>
	<body>
		<h1>Auto-Rent</h1>
		<h1>Login</h1>
		
		<div>
			<h2>Log in</h2>

			<h:form>
				<div>
					<h:outputLabel value="E-mail" for="email" />
					<h:inputText id="email" value="#{userMB.user.email}" required="true" requiredMessage="E-mail" />
				</div>
				
				<div>
					<h:outputLabel value="Senha" for="password" />
					<h:inputSecret id="password" value="#{userMB.user.passwordHash}" required="true" requiredMessage="Senha" />
				</div>

				<h:commandButton action="#{userMB.login}" value="Log In" />
			</h:form>
		</div>
		
		<div>
			<h2>Sign up</h2>
			
			<h:form>
				<div>
					<h:outputLabel value="Nome" for="name" />
					<h:inputText id="name" value="#{userMB.user.name}" required="true" requiredMessage="Nome" />
				</div>

				<div>
					<h:outputLabel value="CPF" for="cpf" />
					<h:inputText id="cpf" value="#{userMB.user.cpf}" required="true" requiredMessage="CPF" />
				</div>
				
				<div>
					<h:outputLabel value="E-mail" for="email" />
					<h:inputText id="email" value="#{userMB.user.email}" required="true" requiredMessage="E-mail" />
				</div>
				
				<div>
					<h:outputLabel value="Senha" for="password" />
					<h:inputSecret id="password" value="#{userMB.user.passwordHash}" required="true" requiredMessage="Senha" />
				</div>

				<h:commandButton action="#{userMB.signin}" value="Sign UP" />
			</h:form>
		</div>
	</body>
</html>
